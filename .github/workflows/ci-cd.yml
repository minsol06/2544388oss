name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Build 및 Matrix 조합 테스트 (Lint/Test + Secrets 사용 + Artifact 업로드)
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # 문법 오류 검사
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test with pytest & Use Secret
      env:
        SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
      run: |
        echo "Testing with injected secret..."
        pytest --version

    - name: Build Artifact create
      run: |
        mkdir build_output
        echo "Build result for ${{ matrix.os }}" > build_output/result.txt

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact-${{ matrix.os }}-${{ matrix.python-version }}
        path: build_output/

  # 2. Test 작업 (Build 의존성)
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Run Integration Tests
      run: echo "Integration tests passed successfully!"

  # 3. Deploy 작업 (Test 의존성 + Artifact 다운로드)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact-ubuntu-latest-3.11
        path: downloaded_build

    - name: Run Deployment
      run: |
        echo "Deploying application..."
        cat downloaded_build/result.txt
