name: Optimized CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
      - '.github/workflows/**'

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 캐싱 적용 (pip 의존성 캐시)
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Run Tests with Cache Verification
      run: |
        echo "Running tests with cached environment..."
        pytest --version

  conditional-deploy:
    needs: build-and-cache
    runs-on: ubuntu-latest
    # main 브랜치에 푸시될 때만 배포가 실행되도록 조건부 설정
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Conditional Deployment Execution
      run: |
        echo "Condition met: Running deployment on main branch push."
